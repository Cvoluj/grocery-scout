<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GroceryScout — Вхід</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--varus:#3B82F6;--green:#10B981;--red:#EF4444;--border:#EBEBEB}
body{font-family:'Inter',sans-serif;background:#F7F7F6;display:flex;align-items:center;justify-content:center;min-height:100vh}

.card{background:#fff;border:1px solid var(--border);width:100%;max-width:380px;padding:40px 36px}

.logo-name{font-size:20px;font-weight:600;letter-spacing:-0.8px;background:linear-gradient(135deg,#0F0F0F 0%,#555 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-size:11px;color:#B0B0B0;font-weight:400;margin-top:4px;letter-spacing:.1px}
.logo{margin-bottom:32px}

.tabs{display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;border:none;background:none;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;color:#C0C0C0;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.3px;text-transform:uppercase;transition:all .15s}
.tab.active{color:#0F0F0F;border-bottom-color:#0F0F0F}

.field{margin-bottom:16px}
.field label{display:block;font-size:10px;font-weight:600;color:#C0C0C0;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.field input{width:100%;padding:10px 0;border:none;border-bottom:1.5px solid var(--border);font-size:13px;font-family:'Inter',sans-serif;color:#0F0F0F;outline:none;background:transparent;transition:border-color .2s}
.field input:focus{border-bottom-color:#0F0F0F}
.field input::placeholder{color:#C8C8C8}

.btn-submit{width:100%;padding:13px;border:none;background:linear-gradient(135deg,#0F0F0F 0%,#2D2D2D 100%);color:#fff;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;margin-top:8px;transition:opacity .15s;position:relative;overflow:hidden}
.btn-submit::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--varus),#6366F1);opacity:0;transition:opacity .3s}
.btn-submit:hover:not(:disabled)::after{opacity:1}
.btn-submit span{position:relative;z-index:1}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}

.error{font-size:12px;color:var(--red);margin-top:14px;min-height:18px;font-weight:400;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-name">GroceryScout</div>
    <div class="logo-sub">Знайди та порівняй ціни</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Вхід</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Реєстрація</button>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">
    <span id="btn-label">Увійти</span>
  </button>

  <div class="error" id="error"></div>
</div>

<script>
(async () => {
  const res = await fetch("/api/auth/me");
  if (res.ok) window.location.href = "/";
})();

let mode = "login";

function switchTab(tab) {
  mode = tab;
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  document.getElementById("btn-label").textContent = tab === "login" ? "Увійти" : "Зареєструватися";
  document.getElementById("error").textContent = "";
  document.getElementById("password").autocomplete = tab === "login" ? "current-password" : "new-password";
}

document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleSubmit(); });
document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") handleSubmit(); });

async function handleSubmit() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("btn-submit");
  const errorEl = document.getElementById("error");

  errorEl.textContent = "";
  if (!email || !password) { errorEl.textContent = "Введіть email та пароль"; return; }

  btn.disabled = true;
  try {
    const res = await fetch(mode === "login" ? "/api/auth/login" : "/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.detail || "Помилка сервера"; return; }
    window.location.href = "/";
  } catch {
    errorEl.textContent = "Помилка з'єднання";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
