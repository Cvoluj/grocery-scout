<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GroceryScout — Вхід</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css"/>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-name">GroceryScout</div>
    <div class="logo-sub">Знайди та порівняй ціни</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Вхід</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Реєстрація</button>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">
    <span id="btn-label">Увійти</span>
  </button>

  <div class="error" id="error"></div>
</div>

<script>
(async () => {
  const res = await fetch("/api/auth/me");
  if (res.ok) window.location.href = "/";
})();

let mode = "login";

function switchTab(tab) {
  mode = tab;
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  document.getElementById("btn-label").textContent = tab === "login" ? "Увійти" : "Зареєструватися";
  document.getElementById("error").textContent = "";
  document.getElementById("password").autocomplete = tab === "login" ? "current-password" : "new-password";
}

document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleSubmit(); });
document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") handleSubmit(); });

async function handleSubmit() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("btn-submit");
  const errorEl = document.getElementById("error");

  errorEl.textContent = "";
  if (!email || !password) { errorEl.textContent = "Введіть email та пароль"; return; }

  btn.disabled = true;
  try {
    const res = await fetch(mode === "login" ? "/api/auth/login" : "/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.detail || "Помилка сервера"; return; }
    window.location.href = "/";
  } catch {
    errorEl.textContent = "Помилка з'єднання";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
