<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Порівняння цін</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css"/>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);">

<div id="topbar">
  <a href="/" id="back-link">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15,18 9,12 15,6"/></svg>
    Карта
  </a>
  <div class="topbar-divider"></div>
  <div class="topbar-logo">GroceryScout</div>
  <div class="topbar-divider"></div>
  <div id="shops-chips"></div>
  <button id="btn-logout" onclick="logout()">Вийти</button>
</div>

<div id="body-split">
  <div id="main">
    <div id="search-card">
      <div id="search-row">
        <div id="query-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="query-input" placeholder="Що шукати? Напр. «молоко», «хліб»"/>
        </div>
        <button id="btn-search">Шукати</button>
        <button id="btn-add-picks">+ Додати вибране</button>
        <button id="btn-clear-picks">✕</button>
      </div>
      <div id="status-row"></div>
    </div>

    <div id="results-summary"></div>
    <div id="results-content"></div>
  </div>

  <div id="cart-panel">
    <div id="cart-header">
      <div id="cart-title">Кошик порівняння</div>
      <div id="cart-subtitle">Додайте товари для порівняння цін</div>
    </div>
    <div id="cart-body">
      <div id="cart-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Натисніть «+ Додати» на групі,<br/>щоб додати до порівняння
      </div>
      <div id="cart-receipts"></div>
    </div>
    <div id="cart-footer" style="display:none">
      <button id="btn-send-receipt"><span id="btn-send-label">📧 Надіслати на пошту</span></button>
      <button id="btn-clear-cart">Очистити кошик</button>
      <div id="send-status"></div>
    </div>
  </div>
</div>

<script>
async function authFetch(url, options = {}) {
  const res = await fetch(url, options);
  if (res.status === 401) { window.location.href = "/login"; throw new Error("Unauthorized"); }
  return res;
}

async function logout() {
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "/login";
}

const BRANDS = {
  atb:   { label: "АТБ",   chipClass: "chip-atb",   badgeClass: "badge-atb",   thBadge: "th-badge-atb"   },
  varus: { label: "Варус", chipClass: "chip-varus", badgeClass: "badge-varus", thBadge: "th-badge-varus" },
  fora:  { label: "Фора",  chipClass: "chip-fora",  badgeClass: "badge-fora",  thBadge: "th-badge-fora"  },
};

const selectedShops = JSON.parse(localStorage.getItem("selected_shops") || "[]");
if (!selectedShops.length) window.location.href = "/";

selectedShops.forEach(s => {
  const chip = document.createElement("span");
  chip.className = `shop-chip ${BRANDS[s.brand].chipClass}`;
  chip.textContent = s.name;
  document.getElementById("shops-chips").appendChild(chip);
});

const shopKey = s => `${s.brand}_${s.id}`;

/* ── Cart state ── */
const cart = [];

function cartHas(canonical) {
  return cart.some(item => item.canonical === canonical);
}

function toggleCartItem(group) {
  const idx = cart.findIndex(item => item.canonical === group.canonical);
  if (idx >= 0) cart.splice(idx, 1);
  else cart.push({ canonical: group.canonical, offers: group.offers });
  renderCart();
  renderResultButtons();
}

function computeReceipts() {
  if (!cart.length) return [];
  const shopKeys = new Set();
  cart.forEach(item => Object.keys(item.offers).forEach(k => shopKeys.add(k)));
  return [...shopKeys].map(sk => {
    const lines = cart.map(item => ({ canonical: item.canonical, offer: item.offers[sk] || null }));
    const available = lines.filter(l => l.offer !== null);
    const total = available.reduce((s, l) => s + l.offer.actual_price, 0);
    const sampleOffer = available[0]?.offer;
    return { shopKey: sk, shopName: sampleOffer?.shop_name ?? sk, brand: sampleOffer?.brand ?? "atb", total, availableCount: available.length, totalCount: cart.length, lines };
  }).sort((a, b) => b.availableCount !== a.availableCount ? b.availableCount - a.availableCount : a.total - b.total);
}

let expandedShop = null;

function renderCart() {
  const receipts = computeReceipts();
  const isEmpty = cart.length === 0;
  document.getElementById("cart-empty").style.display = isEmpty ? "block" : "none";
  document.getElementById("cart-footer").style.display = isEmpty ? "none" : "block";
  document.getElementById("cart-title").textContent = isEmpty ? "Кошик порівняння" : `Кошик порівняння (${cart.length})`;
  document.getElementById("cart-subtitle").textContent = isEmpty ? "Додайте товари для порівняння цін" : `${receipts.length} магазин${plural(receipts.length, "", "и", "ів")}`;

  const bestTotal = receipts.find(r => r.availableCount === r.totalCount)?.total ?? null;
  const container = document.getElementById("cart-receipts");
  container.innerHTML = receipts.map(r => {
    const isBest = bestTotal !== null && r.total === bestTotal && r.availableCount === r.totalCount;
    const isPartial = r.availableCount < r.totalCount;
    const isExpanded = expandedShop === r.shopKey;
    const icon = isBest ? "★" : isPartial ? "⚠" : "✓";
    const linesHtml = r.lines.map(l => {
      if (!l.offer) return `<div class="receipt-item"><span class="ri-name">${esc(l.canonical)}</span><span class="ri-missing">немає</span></div>`;
      const isDiscount = l.offer.special_price !== null && l.offer.special_price !== undefined;
      return `<div class="receipt-item"><span class="ri-name">${esc(l.offer.name)}</span><span class="ri-price${isDiscount ? ' sale' : ''}">${l.offer.actual_price.toFixed(2)} грн</span></div>`;
    }).join("");
    const missing = r.totalCount - r.availableCount;
    return `<div class="receipt-row${isBest ? " best" : ""}${isPartial ? " partial" : ""}${isExpanded ? " expanded" : ""}" data-shop="${esc(r.shopKey)}">
      <div class="receipt-summary">
        <span class="receipt-icon">${icon}</span>
        <span class="receipt-shop-name">${esc(r.shopName)}</span>
        <div class="receipt-right">
          <div class="receipt-total">${r.total.toFixed(2)} грн</div>
          <div class="receipt-count">${r.availableCount}/${r.totalCount}${missing ? ` · ⚠${missing} немає` : ""}</div>
        </div>
      </div>
      <div class="receipt-items">
        ${linesHtml}
        <div class="receipt-subtotal">
          <span>${isBest ? "★ Найкращий кошик" : isPartial ? `<span class="warn">Неповний кошик</span>` : "Разом"}</span>
          <span>${r.total.toFixed(2)} грн</span>
        </div>
      </div>
    </div>`;
  }).join("");

  container.querySelectorAll(".receipt-row").forEach(el => {
    el.addEventListener("click", () => {
      expandedShop = expandedShop === el.dataset.shop ? null : el.dataset.shop;
      renderCart();
    });
  });
}

function renderResultButtons() {
  document.querySelectorAll(".btn-add").forEach(btn => {
    const canonical = btn.dataset.canonical;
    const inCart = cartHas(canonical);
    btn.textContent = inCart ? "✓ В кошику" : "+ Додати";
    btn.classList.toggle("added", inCart);
  });
}

document.getElementById("btn-clear-cart").addEventListener("click", () => {
  cart.length = 0;
  expandedShop = null;
  renderCart();
  renderResultButtons();
});

document.getElementById("btn-send-receipt").addEventListener("click", async () => {
  const receipts = computeReceipts();
  if (!receipts.length) return;

  const btn = document.getElementById("btn-send-receipt");
  const label = document.getElementById("btn-send-label");
  const statusEl = document.getElementById("send-status");

  btn.disabled = true;
  label.textContent = "Надсилаю…";
  statusEl.style.color = "var(--muted)";
  statusEl.textContent = "";

  try {
    const res = await authFetch("/api/send-receipt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        receipts: receipts.map(r => ({
          shop_key: r.shopKey,
          shop_name: r.shopName,
          brand: r.brand,
          total: r.total,
          available_count: r.availableCount,
          total_count: r.totalCount,
          lines: r.lines.map(l => ({
            canonical: l.canonical,
            offer: l.offer ? {
              name: l.offer.name,
              actual_price: l.offer.actual_price,
              price: l.offer.price,
              special_price: l.offer.special_price ?? null,
              image_url: l.offer.image_url ?? null,
              url: l.offer.url ?? null,
            } : null,
          })),
        })),
        shop_ids: selectedShops.map(s => ({ brand: s.brand, id: s.id })),
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    statusEl.style.color = "#10B981";
    statusEl.textContent = "✓ Відправлено на вашу пошту";
    label.textContent = "📧 Надіслати на пошту";
  } catch (err) {
    statusEl.style.color = "var(--red)";
    statusEl.textContent = "Помилка відправки";
    label.textContent = "📧 Надіслати на пошту";
  } finally {
    btn.disabled = false;
  }
});

/* ── Search ── */
document.getElementById("query-input").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
document.getElementById("btn-search").addEventListener("click", doSearch);

function setStatus(msg, loading = false) {
  document.getElementById("status-row").innerHTML = loading
    ? `<div class="spinner-sm"></div><span>${esc(msg)}</span>`
    : `<span>${esc(msg)}</span>`;
}

async function doSearch() {
  const query = document.getElementById("query-input").value.trim();
  if (!query) return;
  const btn = document.getElementById("btn-search");
  btn.disabled = true;
  document.getElementById("results-content").innerHTML = "";
  document.getElementById("results-summary").textContent = "";
  clearPicks();
  try {
    setStatus("Шукаю товари…", true);
    const searchRes = await authFetch("/api/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, shops: selectedShops.map(s => ({ id: s.id, brand: s.brand })) }),
    });
    if (!searchRes.ok) throw new Error(`HTTP ${searchRes.status}`);
    const searchData = await searchRes.json();
    const totalRaw = searchData.reduce((s, r) => s + r.products.length, 0);
    if (!totalRaw) {
      setStatus("Нічого не знайдено");
      document.getElementById("results-content").innerHTML = '<div class="empty-results">Товарів за запитом не знайдено</div>';
      return;
    }
    setStatus("Класифікую результати…", true);
    const matchRes = await authFetch("/api/match", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ results: searchData }),
    });
    if (!matchRes.ok) throw new Error(`HTTP ${matchRes.status}`);
    const groups = await matchRes.json();
    setStatus(`Знайдено ${groups.length} груп${plural(groups.length, "а", "и", "")}`);
    renderResults(groups);
  } catch (err) {
    setStatus(`Помилка: ${esc(err.message)}`);
  } finally {
    btn.disabled = false;
  }
}

/* ── Custom picks ── */
const picks = {};

function clearPicks() {
  for (const k in picks) delete picks[k];
  document.querySelectorAll(".offer-card.selected").forEach(c => c.classList.remove("selected"));
  updatePicksButton();
}

function updatePicksButton() {
  const count = Object.keys(picks).length;
  document.getElementById("btn-add-picks").classList.toggle("show", count > 0);
  document.getElementById("btn-clear-picks").classList.toggle("show", count > 0);
  document.getElementById("btn-add-picks").textContent = count > 0 ? `+ Додати вибране (${count})` : "+ Додати вибране";
}

document.getElementById("btn-clear-picks").addEventListener("click", clearPicks);

document.getElementById("btn-add-picks").addEventListener("click", () => {
  if (!Object.keys(picks).length) return;
  const offers = {};
  const names = [];
  Object.entries(picks).forEach(([sk, { canonical, offer }]) => {
    offers[sk] = offer;
    if (!names.includes(canonical)) names.push(canonical);
  });
  const label = names[0].length > 30 ? names[0].slice(0, 28) + "…" : names[0];
  cart.push({ canonical: `Вибране: ${label}`, offers });
  clearPicks();
  renderCart();
  renderResultButtons();
});

/* ── renderResults ── */
let currentGroups = [];

function renderResults(groups) {
  currentGroups = groups;
  const container = document.getElementById("results-content");

  if (!groups.length) {
    container.innerHTML = '<div class="empty-results">Нічого не знайдено</div>';
    return;
  }

  document.getElementById("results-summary").textContent =
    `${groups.length} груп${plural(groups.length, "а", "и", "")} товарів`;

  const table = document.createElement("table");
  table.id = "grid-table";

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  const thTitle = document.createElement("th");
  thTitle.style.width = "1px";
  headRow.appendChild(thTitle);
  selectedShops.forEach(s => {
    const b = BRANDS[s.brand];
    const th = document.createElement("th");
    th.className = "th-store";
    th.innerHTML = `
      <span class="th-store-badge ${b.thBadge}">${b.label}</span>
      <span class="th-store-name">${esc(s.name)}</span>
      ${s.address ? `<span class="th-store-addr">${esc(s.address)}</span>` : ""}`;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  groups.forEach(group => {
    const prices = selectedShops.map(s => group.offers[shopKey(s)]?.actual_price).filter(p => p != null);
    const minPrice = prices.length ? Math.min(...prices) : null;
    const inCart = cartHas(group.canonical);

    const tbody = document.createElement("tbody");

    const trTitle = document.createElement("tr");
    const tdTitle = document.createElement("td");
    tdTitle.className = "group-title-td";
    tdTitle.setAttribute("colspan", selectedShops.length + 1);
    tdTitle.innerHTML = `<div class="group-title-inner">
      <span class="group-title-text">${esc(group.canonical)}</span>
      <button class="btn-add${inCart ? " added" : ""}" data-canonical="${esc(group.canonical)}">
        ${inCart ? "✓ В кошику" : "+ Додати"}
      </button>
    </div>`;
    tdTitle.querySelector(".btn-add").addEventListener("click", () => {
      const g = currentGroups.find(g => g.canonical === group.canonical);
      if (g) toggleCartItem(g);
    });
    trTitle.appendChild(tdTitle);
    tbody.appendChild(trTitle);

    const trCards = document.createElement("tr");
    trCards.appendChild(document.createElement("td"));

    selectedShops.forEach(s => {
      const sk = shopKey(s);
      const offer = group.offers[sk];
      const td = document.createElement("td");
      td.className = "td-store";

      if (offer) {
        const b = BRANDS[s.brand];
        const isCheapest = minPrice !== null && offer.actual_price === minPrice && prices.length > 1;
        const isDiscount = offer.special_price !== null && offer.special_price !== undefined;
        const isSelected = picks[sk]?.offer === offer;
        const imgHtml = offer.image_url
          ? `<img class="offer-img" src="${esc(offer.image_url)}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
             <div class="offer-img-ph" style="display:none">🛒</div>`
          : `<div class="offer-img-ph">🛒</div>`;

        const card = document.createElement("div");
        card.className = `offer-card${isCheapest ? " cheapest" : ""}${isSelected ? " selected" : ""}`;
        card.innerHTML = `
          ${isCheapest ? '<span class="cheapest-badge">Вигідно</span>' : ""}
          ${imgHtml}
          <div class="offer-brand-row">
            <span class="offer-badge ${b.badgeClass}">${b.label}</span>
            <span class="offer-shop" title="${esc(offer.shop_name)}">${esc(offer.shop_name)}</span>
          </div>
          <div class="offer-name" title="${esc(offer.name)}">${esc(offer.name)}</div>
          <div>
            <span class="price-actual${isDiscount ? " sale" : ""}">${offer.actual_price.toFixed(2)} грн</span>
            ${isDiscount ? `<br><span class="price-old">${offer.price.toFixed(2)} грн</span>` : ""}
          </div>
          ${offer.url ? `<a class="offer-link" href="${esc(offer.url)}" target="_blank" rel="noopener">Переглянути →</a>` : ""}`;

        card.addEventListener("click", e => {
          if (e.target.classList.contains("offer-link")) return;
          if (picks[sk]?.offer === offer) {
            delete picks[sk];
            card.classList.remove("selected");
          } else {
            if (picks[sk]) {
              document.querySelectorAll(`.offer-card[data-sk="${sk}"]`).forEach(c => c.classList.remove("selected"));
            }
            picks[sk] = { canonical: group.canonical, offer };
            card.classList.add("selected");
          }
          updatePicksButton();
        });
        card.dataset.sk = sk;
        td.appendChild(card);
      } else {
        td.innerHTML = '<div class="cell-empty">—</div>';
      }
      trCards.appendChild(td);
    });

    tbody.appendChild(trCards);
    table.appendChild(tbody);
  });

  container.innerHTML = "";
  container.appendChild(table);
}

/* ── Utils ── */
function plural(n, one = "", few = "и", many = "ів") {
  if (n % 10 === 1 && n % 100 !== 11) return one;
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return few;
  return many;
}
function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

renderCart();
</script>
</body>
</html>
